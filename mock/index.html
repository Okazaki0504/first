<title>中小企業診断士 学習アプリ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700;800&display=swap">
<style>
/* Layout: 1 phone-sized game screen, HUD on top, scrolling content, tab bar fixed at bottom. Single dark "game world" theme by choice. */
:root{
  --night:#141a33;      /* 夜の空 = 背景 */
  --panel:#1f2850;      /* ウィンドウ */
  --panel-2:#2a3466;
  --line:#e9e4cf;       /* RPGウィンドウ枠 */
  --ink:#f3efe0;
  --muted:#a7add0;
  --gold:#f2c14e;       /* EXP・報酬 */
  --hp:#ff6b6b;
  --mp:#5ec8f2;
  --ok:#7ee08a;
  --f-pixel:"DotGothic16","M PLUS 1p",system-ui,sans-serif;
  --f-body:"M PLUS 1p","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;
  background-image:radial-gradient(circle at 20% 10%,#24305f 0,transparent 40%),radial-gradient(circle at 80% 70%,#1d2550 0,transparent 45%);}
.app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:96px}
.mock-tag{font-family:var(--f-pixel);font-size:11px;color:var(--night);background:var(--gold);padding:2px 8px;border-radius:2px;align-self:flex-start;margin-top:10px;letter-spacing:.05em}
/* RPG window */
.win{background:var(--panel);border:3px solid var(--line);border-radius:6px;box-shadow:0 0 0 3px var(--night),0 0 0 5px #3b4683;padding:12px 14px}
.win h2{font-family:var(--f-pixel);font-weight:400;font-size:15px;margin:0 0 8px;color:var(--gold);letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.pix{font-family:var(--f-pixel)}
/* HUD */
.hud{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.avatar{width:64px;height:64px;background:var(--panel-2);border:2px solid var(--line);border-radius:4px;display:grid;place-items:center}
.hud .name{font-family:var(--f-pixel);font-size:16px;display:flex;justify-content:space-between;gap:6px}
.hud .job{font-size:11px;color:var(--muted)}
.bar{height:10px;background:#0c1024;border:1px solid #4a5590;border-radius:2px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.exp>i{background:linear-gradient(90deg,#d9a52e,var(--gold))}
.bar.hp>i{background:var(--hp)}
.bar.mp>i{background:var(--mp)}
.barlabel{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--f-pixel);font-size:12px;background:#0f1430;border:1px solid #4a5590;border-radius:3px;padding:4px 8px}
.chip b{color:var(--gold);font-weight:400}
/* quests */
.quest{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed #4a5590}
.quest:first-of-type{border-top:0}
.quest .box{width:18px;height:18px;border:2px solid var(--line);border-radius:2px;display:grid;place-items:center;font-size:12px;color:var(--night)}
.quest.done .box{background:var(--ok);border-color:var(--ok)}
.quest.done .qt{color:var(--muted);text-decoration:line-through}
.quest .rw{font-family:var(--f-pixel);font-size:11px;color:var(--gold)}
/* dungeons */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dg{background:#0f1430;border:1px solid #4a5590;border-radius:4px;padding:8px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.dg:hover,.dg:focus-visible{border-color:var(--gold);outline:none}
.dg .t{font-size:12px;font-weight:700;line-height:1.3;min-height:2.6em}
.dg .lv{font-family:var(--f-pixel);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;font-family:var(--f-pixel);font-size:13px;background:#0f1430;color:var(--muted);border:1px solid #4a5590;border-radius:3px;padding:6px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--night);border-color:var(--gold)}
/* battle */
.arena{position:relative;height:170px;border:3px solid var(--line);border-radius:6px;overflow:hidden;
  background:linear-gradient(#2b2f6b 0 55%,#3a3a55 55% 100%);display:grid;place-items:center}
.arena .mon{image-rendering:pixelated;transition:transform .15s}
.arena .mon.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}25%{transform:translateX(-8px);filter:brightness(3)}75%{transform:translateX(8px)}}
.arena .dmg{position:absolute;top:30%;font-family:var(--f-pixel);font-size:26px;color:var(--gold);text-shadow:2px 2px 0 #000;opacity:0}
.arena .dmg.show{animation:pop .9s}
/* --- 派手な演出（v0.5） --- */
.arena.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
.slash{position:absolute;left:50%;top:50%;width:180px;height:6px;margin:-3px 0 0 -90px;background:linear-gradient(90deg,transparent,#fff,var(--gold),transparent);transform:rotate(-30deg) scaleX(0);border-radius:3px;box-shadow:0 0 12px #fff;pointer-events:none}
.slash.go{animation:slash .32s ease-out forwards}
.slash.b{transform:rotate(30deg) scaleX(0)}.slash.b.go{animation:slash2 .32s .08s ease-out forwards}
@keyframes slash{0%{transform:rotate(-30deg) scaleX(0);opacity:1}60%{transform:rotate(-30deg) scaleX(1.2);opacity:1}100%{transform:rotate(-30deg) scaleX(1.3);opacity:0}}
@keyframes slash2{0%{transform:rotate(30deg) scaleX(0);opacity:1}60%{transform:rotate(30deg) scaleX(1.2);opacity:1}100%{transform:rotate(30deg) scaleX(1.3);opacity:0}}
.pop{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-pixel);font-size:30px;color:#fff;text-shadow:3px 3px 0 #000,0 0 10px var(--gold);pointer-events:none;animation:pop2 1s forwards;white-space:nowrap}
.pop.crit{font-size:28px;color:var(--gold)}
@keyframes pop2{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.25)}35%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-40px)}}
.combo{position:absolute;right:10px;bottom:10px;font-family:var(--f-pixel);font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #000;animation:bump .3s}
@keyframes bump{0%{transform:scale(1.8)}100%{transform:scale(1)}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:8;animation:flash .25s forwards}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
.mon.dying{animation:dying .9s forwards}
@keyframes dying{0%,20%,40%{opacity:1;filter:brightness(3)}10%,30%,50%{opacity:.2}70%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(.2) rotate(25deg)}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:9;pointer-events:none}
.warn{font-family:var(--f-pixel);font-size:44px;color:var(--hp);letter-spacing:.1em;text-shadow:0 0 16px var(--hp),3px 3px 0 #000;animation:warn 1.6s forwards;background:rgba(80,0,20,.55);width:100%;text-align:center;padding:14px 0;border-block:3px solid var(--hp)}
@keyframes warn{0%{opacity:0;transform:scaleY(0)}12%{opacity:1;transform:scaleY(1)}25%,45%,65%{opacity:1}35%,55%{opacity:.35}85%{opacity:1}100%{opacity:0}}
.victory{font-family:var(--f-pixel);font-size:42px;color:var(--gold);text-shadow:0 0 18px var(--gold),3px 3px 0 #000;animation:vic 2.2s forwards;text-align:center}
.victory small{display:block;font-size:16px;color:#fff}
@keyframes vic{0%{opacity:0;transform:scale(3)}15%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.chest{font-family:var(--f-pixel);font-size:18px;color:#fff;text-align:center;animation:vic 2s forwards}
.chest .box{width:64px;height:48px;margin:0 auto 6px;background:#b5523b;border:4px solid var(--gold);border-radius:6px 6px 2px 2px;position:relative}
.chest .box::before{content:"";position:absolute;left:-4px;right:-4px;top:-18px;height:18px;background:#c9683f;border:4px solid var(--gold);border-radius:8px 8px 0 0;transform-origin:left bottom;animation:lid .5s .3s forwards}
@keyframes lid{to{transform:rotate(-35deg)}}
.lvup .big{animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lvup canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.studied{font-size:11px;color:var(--ok);font-family:var(--f-pixel)}
@keyframes pop{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.monhp{position:absolute;top:8px;left:10px;right:10px}
.monhp .barlabel{color:var(--ink)}
.msg{font-family:var(--f-pixel);font-size:14px;line-height:1.7;min-height:4.4em}
.choices{display:grid;gap:8px;margin-top:8px}
.choice{text-align:left;background:#0f1430;color:var(--ink);border:2px solid #4a5590;border-radius:4px;padding:10px 12px;font:inherit;font-size:13px;cursor:pointer;line-height:1.45}
.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--gold);outline:none}
.choice.right{border-color:var(--ok);background:#173a2a}
.choice.wrong{border-color:var(--hp);background:#3a1a24}
.btn{font-family:var(--f-pixel);font-size:15px;background:var(--gold);color:var(--night);border:0;border-radius:4px;padding:12px;width:100%;cursor:pointer;box-shadow:0 4px 0 #a37c1f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a37c1f}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.explain{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;border-left:3px solid var(--gold);padding-left:8px}
/* timer */
.timer{font-family:var(--f-pixel);font-size:54px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:6px 0}
select,input[type=date]{width:100%;background:#0f1430;color:var(--ink);border:1px solid #4a5590;border-radius:4px;padding:8px;font:inherit}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
/* records */
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .col i{width:100%;background:var(--mp);border-radius:2px 2px 0 0;min-height:2px}
.chart .col.today i{background:var(--gold)}
.chart .col span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.kakomon{overflow-x:auto}
.kakomon table{border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.kakomon th,.kakomon td{border:1px solid #3b4683;width:26px;height:26px;text-align:center;padding:0}
.kakomon th{color:var(--muted);font-weight:400;background:#0f1430}
.kakomon td button{width:100%;height:100%;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer}
.kakomon td.o{background:#173a2a}.kakomon td.x{background:#3a1a24}.kakomon td.t{background:#3a331a}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bd{background:#0f1430;border:1px solid #4a5590;border-radius:4px;padding:8px 6px;text-align:center;opacity:.55}
.bd.got{opacity:1;border-color:var(--gold)}
.bd .ic{font-size:22px;color:var(--gold)}
.bd .bn{font-size:12px;font-weight:700;margin:2px 0}
.legend{font-size:11px;color:var(--muted);margin-top:6px}
.note{font-size:11px;color:var(--muted);line-height:1.6}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#0c1024;border-top:3px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabbar nav{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;color:var(--muted);font-family:var(--f-pixel);font-size:11px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%) translateY(-120%);background:var(--panel);border:3px solid var(--gold);border-radius:6px;padding:10px 16px;font-family:var(--f-pixel);font-size:14px;z-index:9;transition:transform .35s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
.lvup{position:fixed;inset:0;background:rgba(8,10,25,.85);display:grid;place-items:center;z-index:10}
.lvup .win{text-align:center;max-width:300px}
.lvup .big{font-family:var(--f-pixel);font-size:34px;color:var(--gold);margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

<script>

 {id:"eco",n:"経済学・経済政策"},{id:"fin",n:"財務・会計"},{id:"mgt",n:"企業経営理論"},{id:"ops",n:"運営管理"},
 {id:"law",n:"経営法務"},{id:"it",n:"経営情報システム"},{id:"sme",n:"中小企業経営・政策"}];
const SUBJ2=[{id:"c1",n:"事例I 組織・人事"},{id:"c2",n:"事例II マーケティング"},{id:"c3",n:"事例III 生産・技術"},{id:"c4",n:"事例IV 財務・会計"}];
const MON={eco:"需給の霧",fin:"簿記ゴーレム",mgt:"戦略の亡霊",ops:"在庫スライム",law:"条文ナイト",it:"バグ蝙蝠",sme:"白書の番人",c1:"組織の迷宮",c2:"売場の魔女",c3:"工程の竜",c4:"CF竜王"};
// サンプル一問一答（オリジナル問題。本番では各科目100問をClaudeが作成→あなたが検証）
const QS=[
 {s:"eco",q:"需要の価格弾力性が1より大きい財の価格を引き下げると、企業の総収入はどうなる？",c:["増加する","減少する","変わらない","価格弾力性とは無関係"],a:0,e:"弾力的な財は、値下げ率以上に需要量が増えるため総収入は増加します。"},
 {s:"fin",q:"固定費400万円、変動費率60%の会社の損益分岐点売上高は？",c:["640万円","1,000万円","667万円","240万円"],a:1,e:"損益分岐点売上高 = 固定費 ÷ 限界利益率 = 400 ÷ (1−0.6) = 1,000万円。"},
 {s:"mgt",q:"PPMで「市場成長率が高く、相対的市場シェアが低い」事業は？",c:["花形","金のなる木","問題児","負け犬"],a:2,e:"問題児は資金流出が大きく、育成か撤退かの判断が必要な事業です。"},
 {s:"ops",q:"重点管理のために品目を売上高などの多い順に並べ、A・B・Cに区分する手法は？",c:["ABC分析","PERT","ECRS","SLP"],a:0,e:"ABC分析（パレート分析）は少数の重要品目を重点管理する考え方です。"},
 {s:"law",q:"会社法上、公開会社の取締役の任期は原則として何年？（選任後○年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結時まで）",c:["1年","2年","4年","10年"],a:1,e:"原則2年。非公開会社は定款で10年まで伸長できます。"},
 {s:"it",q:"関係データベースで、表の各行を一意に識別するための列（の組合せ）を何という？",c:["外部キー","主キー","インデックス","ビュー"],a:1,e:"主キーは重複不可・NULL不可で、行を一意に識別します。"},
 {s:"sme",q:"中小企業基本法における製造業の中小企業者の定義は？",c:["資本金1億円以下 又は 従業員100人以下","資本金3億円以下 又は 従業員300人以下","資本金5千万円以下 又は 従業員50人以下","資本金3億円以下 かつ 従業員300人以下"],a:1,e:"製造業その他は「3億円以下 又は 300人以下」。「又は」がポイントです。"},
 {s:"c4",q:"ROE（自己資本利益率）を求める式は？",c:["当期純利益 ÷ 総資本","営業利益 ÷ 売上高","当期純利益 ÷ 自己資本","経常利益 ÷ 自己資本"],a:2,e:"ROE = 当期純利益 ÷ 自己資本。デュポン分解で売上高純利益率×総資本回転率×財務レバレッジ。"},
 {s:"eco",tf:1,q:"【○×】GDPには、中古品の売買額も含まれる。",c:["○","×"],a:1,e:"×。GDPはその期間に新たに生み出された付加価値。中古品は過去に計上済みのため含みません（仲介手数料は含む）。"},
 {s:"law",tf:1,q:"【○×】特許権の存続期間は、原則として出願日から20年である。",c:["○","×"],a:0,e:"○。特許権は出願日から20年（医薬品等は延長登録あり）。"},
 {s:"ops",tf:1,q:"【○×】ECRSの原則の「E」は Eliminate（排除）を表す。",c:["○","×"],a:0,e:"○。E排除→C結合→R交換→S簡素化の順で改善を検討します。"},
 {s:"c1",tf:1,q:"【○×】成果主義的な賃金制度は、短期的な成果志向を強め、長期的な人材育成やチームワークを損なうおそれがある。",c:["○","×"],a:0,e:"○。事例Iでは成果主義導入のデメリットと、評価の公平性・納得性の確保がよく問われます。"},
 {s:"c3",tf:1,q:"【○×】受注生産の個別生産型企業では、一般に「見込み生産」より製品在庫が多くなりやすい。",c:["○","×"],a:1,e:"×。受注してから生産するため製品在庫は少なくなります。課題になりやすいのは納期管理です。"},
 {s:"c2",q:"2次試験 事例IIで頻出の「誰に・何を・どのように・効果」のうち、「誰に」にあたるのは？",c:["ターゲット顧客","販売チャネル","商品コンセプト","期待される売上"],a:0,e:"助言問題は「ターゲット・商品・手段・効果」を盛り込むと得点要素を拾いやすくなります。"},
];

function baseSvg(st){const R=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
 let s=R(0,0,96,40,"#2b2f6b")+R(0,40,96,14,"#3d6b3a")+R(0,50,96,4,"#2e5230")+R(70,6,6,6,"#f3efe0");
 const hut=(x)=>R(x,30,12,10,"#c9a26b")+R(x-1,26,14,4,"#b5523b")+R(x+2,24,8,2,"#b5523b")+R(x+5,34,3,6,"#3b2a1a");
 const house=(x,h,c)=>R(x,40-h,14,h,c)+R(x-1,36-h,16,4,"#3f5fd1")+R(x+2,44-h,3,3,"#f2c14e")+R(x+9,44-h,3,3,"#f2c14e")+R(x+5,34,4,6,"#3b2a1a");
 if(st===0){s+=hut(20)+hut(44)+R(66,28,3,12,"#5a3b22")+R(62,22,11,8,"#3d8b3a")}
 if(st===1){s+=R(4,32,88,8,"#8a8fa8")+house(10,14,"#e9e4cf")+house(30,18,"#d9c7a0")+house(52,14,"#e9e4cf")+house(72,16,"#d9c7a0")}
 if(st===2){s+=R(4,30,88,10,"#8a8fa8")+R(30,14,36,26,"#d7d9e6")+R(26,8,10,32,"#c4c7d8")+R(60,8,10,32,"#c4c7d8")+R(43,2,10,14,"#c4c7d8")
   +R(26,5,10,3,"#b5523b")+R(60,5,10,3,"#b5523b")+R(43,0,10,2,"#b5523b")+R(44,28,8,12,"#3b2a1a")+R(30,18,3,4,"#f2c14e")+R(63,18,3,4,"#f2c14e")+R(47,-2,1,4,"#f3efe0")+R(48,-2,4,2,"#f2c14e")}
 return `<svg viewBox="0 0 96 54" width="100%" shape-rendering="crispEdges" style="display:block;border:2px solid var(--line);border-radius:4px" aria-label="${STAGES[st].n}">${s}</svg>`}

 return `<svg viewBox="0 0 ${w} ${h}" width="${w*px}" height="${h*px}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const heroSvg=()=>sprite(SPR.hero,{1:"#141a33",2:"#5ec8f2",3:"#f5d6b4",d:"#141a33",4:"#3f5fd1",5:"#141a33"},5);

function burst(host,colors,n=36,opt={}){const c=document.createElement("canvas");c.className="fx";host.appendChild(c);
 const r=host.getBoundingClientRect(),dpr=2;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
 const cx=opt.x??r.width/2,cy=opt.y??r.height/2;const ps=Array.from({length:n},()=>{const a=Math.random()*Math.PI*2,s=(opt.speed||4)*(0.4+Math.random());
  return{x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(opt.up||1),life:1,sz:3+Math.random()*4,col:colors[Math.floor(Math.random()*colors.length)]}});
 let t=0;(function step(){g.clearRect(0,0,r.width,r.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=opt.grav??.15;p.life-=.02;
  g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.col;g.fillRect(p.x,p.y,p.sz,p.sz)});if(++t<60)requestAnimationFrame(step);else c.remove()})()}
function overlay(html,ms){const o=document.createElement("div");o.className="overlay";o.innerHTML=html;document.body.appendChild(o);setTimeout(()=>o.remove(),ms)}
function flash(){const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),300)}
function attackFx(crit){const a=$(".arena");if(!a)return;a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");
 ["slash","slash b"].forEach(k=>{const s=document.createElement("div");s.className=k;a.appendChild(s);requestAnimationFrame(()=>s.classList.add("go"));setTimeout(()=>s.remove(),500)});
 const p=document.createElement("div");p.className="pop"+(crit?" crit":"");p.textContent=crit?`会心の一撃！ -${crit}`:"-25";a.appendChild(p);setTimeout(()=>p.remove(),1000);
 burst(a,crit?["#f2c14e","#fff","#ff9f6b"]:["#fff","#f2c14e"],crit?50:24);if(crit)flash();
 if(S.win>=2){const c=document.createElement("div");c.className="combo";c.textContent=S.win+" COMBO!";a.appendChild(c)}}
function defeatFx(){const m=$("#mon"),a=$(".arena");if(m)m.classList.add("dying");setTimeout(()=>{if(a)burst(a,["#7ee08a","#fff","#5ec8f2","#f2c14e"],70,{speed:6})},600);
 setTimeout(()=>{overlay('<div class="chest"><div class="box"></div>宝箱を手に入れた！<br><b style="color:#f2c14e">GOLD +40</b></div>',2000);
  setTimeout(()=>burst(document.querySelector(".overlay")||document.body,["#f2c14e","#ffe08a"],40,{up:4,grav:.25}),350)},900)}

 <p class="legend">マスをタップ：○→△→×→空 の順に切替。問題文は載せず、手元の過去問題集と照らして記録します。</p></section>
 <section class="win"><h2>▶ 実績バッジ</h2><div class="badges">${BADGES.map(([k,n,d,got])=>{const g=got||(S.badges||[]).includes(k);return `<div class="bd ${g?"got":""}"><div class="ic pix">${g?"★":"？"}</div><div class="bn">${g?n:"？？？"}</div><div class="note">${d}</div></div>`}).join("")}</div></section>
 <section class="win"><h2>▶ 苦手論点（自動抽出・例）</h2><div class="quest"><span class="box" style="background:var(--hp);border-color:var(--hp)"></span><span>財務・会計：キャッシュフロー計算書</span><span class="rw">正答率32%</span></div>
 <div class="quest"><span class="box" style="background:var(--gold);border-color:var(--gold)"></span><span>経営法務：知的財産権</span><span class="rw">正答率48%</span></div></section>`}

function vBook(){return `<section class="win"><h2>▶ 冒険の書（設定・計画）</h2>
 <label class="f" for="e1">1次試験日（仮）</label><input type="date" id="e1" value="${S.exam1}">
 <label class="f" for="e2">2次試験日（仮）</label><input type="date" id="e2" value="${S.exam2}">
 <label class="f" for="goal">週の目標修行時間</label><select id="goal"><option>10時間</option><option selected>15時間</option><option>20時間</option></select>
 <div class="chips"><span class="chip">1次まで <b>${days(S.exam1)}</b>日</span><span class="chip">2次まで <b>${days(S.exam2)}</b>日</span></div></section>
 <section class="win"><h2>▶ お知らせ（通知）</h2>
 <label class="f" style="display:flex;justify-content:space-between;align-items:center"><span>毎日のクエスト通知</span><input type="checkbox" id="notif" ${S.notif?"checked":""}></label>
 <label class="f" for="ntime">通知する時刻</label><input type="time" id="ntime" value="${S.ntime}" ${S.notif?"":"disabled"} style="width:100%;background:#0f1430;color:var(--ink);border:1px solid #4a5590;border-radius:4px;padding:8px;font:inherit">
 <p class="note">例：「勇者よ、今日のクエストが3つ待っている！（連続12日目）」と端末内から通知。サーバー不要。</p></section>
 <section class="win"><h2>▶ 逆算プラン（自動）</h2>
 ${[["今〜3月","財務・会計／経済学で基礎体力"],["4月〜6月","暗記系（法務・情報・中小）を周回"],["7月","過去問5年分×7科目の総仕上げ"],["8月〜10月","2次 事例I〜IVを週2事例"]].map(([a,b])=>`<div class="quest"><span class="box"></span><span><b class="pix" style="font-weight:400;color:var(--gold)">${a}</b><br>${b}</span><span></span></div>`).join("")}
 </section><section class="win"><h2>▶ 演出</h2>
 <label class="f" style="display:flex;justify-content:space-between;align-items:center"><span>振動（正解・レベルアップ時）</span><input type="checkbox" checked></label>
 <p class="note">効果音・BGMはなし。電車の中でも使えます。</p>
 <div style="margin-top:8px"><button class="btn ghost" id="replayOnb">はじめの物語をもう一度見る</button></div></section>
 <section class="win"><h2>▶ セーブデータ</h2><p class="note">データはこの端末の中だけに保存（サーバー送信なし）。</p><button class="btn ghost" id="reset">モックを初期状態にもどす</button></section>`}

function render(){renderTabs();const v=$("#view");v.innerHTML={home:vHome,battle:vBattle,train:vTrain,log:vLog,book:vBook}[tab]();bind()}
function bind(){
 document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{seg=+b.dataset.s;render()});
 document.querySelectorAll(".dg").forEach(b=>b.onclick=()=>{if((S.dlv[b.dataset.id]||0)>=10){startBoss(b.dataset.id);return}const has=QS.some(q=>q.s===b.dataset.id);newBattle(has?b.dataset.id:null);if(!has)toast("この科目のサンプル問題は製品版で");tab="battle";render()});
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,bt=battle;bt.ans=i;
  if(i===bt.q.a&&bt.boss)bt.boss.ok++;
  studyTick();
  if(i===bt.q.a){S.win++;const crit=S.win>=3?50:0;bt.mhp=Math.max(0,bt.mhp-(crit||25));S.dlv[bt.q.s]=Math.min(10,(S.dlv[bt.q.s]||0)+(S.win%3===0?1:0));render();
   const m=$("#mon");m.classList.add("hit");attackFx(crit);gainExp(15,"正解！");if(S.win>=5)doneQuest("q5");}
  else{S.win=0;S.hp=Math.max(0,S.hp-10);save();render();}});
 const nx=$("#next");if(nx)nx.onclick=()=>{const B=battle.boss;if(B){if(B.n>=10){const win=B.ok>=8;battle=null;tab="home";if(win){S.gold+=300;S.badges=(S.badges||[]).concat("fin-clear");victoryFx();setTimeout(()=>gainExp(100,"ボス撃破！科目クリア GOLD+300"),2300)}else toast(`正解${B.ok}/10…あと${8-B.ok}問で撃破だった。再挑戦しよう`);save();render();return}
   const keep=B;newBattle(null);battle.boss={...keep,n:keep.n+1};render();return}if(battle.mhp<=0){S.gold+=40;defeatFx();battle.mhp=100;const f=battle.filter;setTimeout(()=>{newBattle(f);save();render()},2900);return}newBattle(battle.filter);save();render()};
 const ts=$("#tsubj");if(ts)ts.onchange=()=>timer.subj=ts.value;
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{clearInterval(timer.id);Object.assign(timer,{mode:b.dataset.m,on:false,sec:0,brk:false});render()});
 const tb=$("#tbtn");if(tb)tb.onclick=()=>{timer.on=!timer.on;if(timer.on){timer.id=setInterval(()=>{timer.sec+=60;
   if(timer.mode==="pomo"&&timer.sec>=(timer.brk?5:25)*60){timer.sec=0;if(!timer.brk){timer.sets++;record(25)}timer.brk=!timer.brk;render();return}
   const c=$("#tclock");if(c)c.textContent=clockText()},1000)}else clearInterval(timer.id);render()};
 const te=$("#tend");if(te)te.onclick=()=>{clearInterval(timer.id);timer.on=false;const m=Math.floor(timer.sec/60);if(m<1){toast("まだ修行していないようだ");return}
  timer.sec=0;record(m);render()};
 const mr=$("#mrec");if(mr)mr.onclick=()=>{record(+$("#mmin").value);render()};
 const nt=$("#notif");if(nt)nt.onchange=()=>{S.notif=nt.checked;save();render();toast(S.notif?"通知をオンにした":"通知をオフにした")};
 const ntm=$("#ntime");if(ntm)ntm.onchange=()=>{S.ntime=ntm.value;save();toast(S.ntime+" に通知します")};
 document.querySelectorAll(".kakomon button").forEach(b=>b.onclick=()=>{const td=b.parentElement,cur=td.className,nx={"":"o",o:"t",t:"x",x:""}[cur]??"o";S.km[b.dataset.k]=nx;
  if(Object.keys(S.km).length>=12)doneQuest("km");save();render()});
 ["e1","e2"].forEach(id=>{const el=$("#"+id);if(el)el.onchange=()=>{S[id==="e1"?"exam1":"exam2"]=el.value;save();render()}});
 const ro=$("#replayOnb");if(ro)ro.onclick=showOnb;
 const tw=$("#tower");if(tw)tw.onclick=()=>{newBattle("fin");tab="battle";render();toast("復習の塔：今日の復習 8問")};
 const rs=$("#reset");if(rs)rs.onclick=()=>{S=structuredClone(DEF);battle=null;save();render();toast("初期状態にもどした")};
}
// ---------- 初回起動（物語＋設定3問） ----------
const ONB=[
 {story:"ここは「中小企業の国」。\n多くの会社が、経営の悩みという霧に包まれている。"},
 {story:"霧を晴らせるのは、7つのダンジョンと4つの試練を越えた者――\n「中小企業診断士」だけだという。"},
 {story:"君はいま、はじまりの村に立っている。\n冒険の準備をしよう。"},
 {q:"どの試験に挑む？",k:"target",o:["1次試験から","2次試験のみ","1次・2次ストレート"]},
 {q:"試験日（仮）はいつ？",k:"date"},
 {q:"1週間の目標修行時間は？",k:"goal",o:["5時間","10時間","15時間","20時間"]},
];
let onbI=0;
function showOnb(){onbI=0;$("#onb").hidden=false;drawOnb()}
function drawOnb(){const st=ONB[onbI],last=onbI===ONB.length-1;let h=`<div class="note pix">${onbI+1} / ${ONB.length}</div>`;
 if(st.story)h+=`<div style="margin:6px 0 10px">${heroSvg()}</div><p class="msg" style="white-space:pre-line">${st.story}</p><button class="btn" id="onbNext">▶ つづける</button>`;
 else{h+=`<h2 style="margin-top:6px">${st.q}</h2>`;
  if(st.k==="date")h+=`<input type="date" id="onbDate" value="${S.exam1}"><p class="note">あとで「冒険の書」から変更できます。</p><div style="margin-top:10px"><button class="btn" id="onbNext">けってい</button></div>`;
  else h+=`<div class="choices">${st.o.map((o,i)=>`<button class="choice" data-o="${i}">${o}</button>`).join("")}</div>`}
 $("#onbBody").innerHTML=h;
 const nx=$("#onbNext");if(nx)nx.onclick=()=>{const d=$("#onbDate");if(d){S.exam1=d.value;save()}step()};
 document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>step());
 function step(){if(last){$("#onb").hidden=true;S.onb=true;save();render();toast("冒険のはじまりだ！")}else{onbI++;drawOnb()}}}
render();
if(!S.onb)showOnb();
</script>
