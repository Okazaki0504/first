# Codemagic のビルド設定（iPhoneアプリをビルドして TestFlight へ送る）
# 事前準備は docs/診断士アプリ_作成手順書.pdf の「4. ビルド」を参照
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app # Flutterアプリはリポジトリの app/ フォルダにある
    integrations:
      app_store_connect: codemagic_asc # Codemagicに登録したApp Store Connect APIキーの名前
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.okazaki0504.shindanquest
      flutter: 3.47.9 # Claude側の動作確認と同じバージョンに固定
      xcode: latest
      cocoapods: default
    # 自動ビルドはしない（無料枠の節約）。Codemagicの画面から手動で開始する
    scripts:
      - name: パッケージを取得
        script: flutter pub get
      - name: 自動テスト
        script: flutter test
      - name: 署名の設定をXcodeプロジェクトに反映
        script: xcode-project use-profiles
      - name: CocoaPods をインストール
        script: find . -name "Podfile" -execdir pod install \;
      - name: ipa をビルド
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # アップロードだけ行う（自分のiPhoneで試す「内部テスト」に審査は不要）。
        # 外部テスターに配る段階になったら true にし、App Store Connect でテスト情報を入力する
        submit_to_testflight: false
